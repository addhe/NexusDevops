---
# Playbook: Deploy NexusChiefCommander
# =====================================
# Deploys NexusChiefCommander (OpenClaw agent) to the provisioned VM
#
# Usage (staging):
#   ansible-playbook playbooks/nexus-chief/deploy.yml \
#     -i inventory/stg/nexus-chief/ \
#     -e "deploy_env=staging"
#
# Usage (production):
#   ansible-playbook playbooks/nexus-chief/deploy.yml \
#     -i inventory/prd/nexus-chief/ \
#     -e "deploy_env=production"

- name: Deploy NexusChiefCommander
  hosts: nexus_chief
  become: true
  gather_facts: true

  pre_tasks:
    - name: Set env directory
      set_fact:
        env_dir: "{{ playbook_dir | dirname | dirname }}/inventory/{{ deploy_env | default('stg') }}/nexus-chief"

    - name: Load all vars
      include_vars:
        file: "{{ env_dir }}/group_vars/all/main.yml"

    - name: Load vault vars
      include_vars:
        file: "{{ env_dir }}/group_vars/all/vault.yml"

    - name: Load openclaw vars
      include_vars:
        file: "{{ env_dir }}/group_vars/all/openclaw.yml"

    - name: Load owner vars
      include_vars:
        file: "{{ env_dir }}/group_vars/all/owner.yml"

    - name: Load gcp vars
      include_vars:
        file: "{{ env_dir }}/group_vars/all/gcp.yml"

    - name: Wait for SSH
      wait_for_connection:
        timeout: 300

    - name: Gather facts
      setup:

    - name: Display deployment info
      debug:
        msg: |
          ================================
          Deploying NexusChiefCommander ({{ deploy_env | default('stg') }})
          ================================
          Host: {{ ansible_host | default(inventory_hostname) }}
          Environment: {{ deploy_env | default('stg') }}
          Instance: {{ instance_name | default('nexus-chief-001-stg') }}
          Model: {{ openclaw_model }}
          Gateway Port: {{ gateway_port }}
          ================================

  roles:
    - role: openclaw-prereq
      tags:
        - prereq
        - nodejs

    - role: openclaw-install
      tags:
        - install
        - openclaw

    - role: openclaw-config
      tags:
        - config
        - openclaw

  post_tasks:
    - name: Verify Telegram bot token
      command: "grep -q 'botToken' /home/{{ openclaw_user }}/.openclaw/openclaw.json"
      register: token_check
      changed_when: false
      failed_when: token_check.rc != 0

    - name: Verify owner configuration
      command: "grep -q '{{ owner_telegram_id }}' /home/{{ openclaw_user }}/.openclaw/openclaw.json"
      register: owner_check
      changed_when: false
      failed_when: owner_check.rc != 0

    - name: Display completion
      debug:
        msg: |
          ================================
          NexusChiefCommander Deployed! 🎛️ ({{ deploy_env | default('stg') }})
          ================================
          Host: {{ ansible_host | default(inventory_hostname) }}
          Environment: {{ deploy_env | default('stg') }}
          Instance: {{ instance_name | default('nexus-chief-001-stg') }}
          Gateway Port: {{ gateway_port }}
          Model: {{ openclaw_model }}
          ================================
          Security:
          ✅ Owner: @{{ owner_username }} (ID: {{ owner_telegram_id }})
          ✅ Bot: {{ bot_name }} ({{ bot_full_name }})
          ================================
          Test:
          curl http://{{ ansible_host | default('localhost') }}:{{ gateway_port }}/status
          ===================================