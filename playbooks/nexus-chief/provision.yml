---
# Playbook: Provision NexusChiefCommander VM
# ===========================================
# Provisions a GCP e2-standard-2 spot instance for NexusChiefCommander
#
# Usage:
#   # Staging
#   ansible-playbook playbooks/nexus-chief/provision.yml \
#     -e "deploy_env=staging"
#
#   # Production
#   ansible-playbook playbooks/nexus-chief/provision.yml \
#     -e "deploy_env=production"

- name: Provision NexusChiefCommander VM
  hosts: localhost
  connection: local
  gather_facts: true

  pre_tasks:
    - name: Set environment-specific vars
      include_vars:
        file: "{{ playbook_dir | dirname | dirname }}/inventory/{{ deploy_env | default('stg') }}/nexus-chief/group_vars/all/main.yml"
      when: deploy_env is defined or true

    - name: Include vault vars
      include_vars:
        file: "{{ playbook_dir | dirname | dirname }}/inventory/{{ deploy_env | default('stg') }}/nexus-chief/group_vars/all/vault.yml"

    - name: Include gcp vars
      include_vars:
        file: "{{ playbook_dir | dirname | dirname }}/inventory/{{ deploy_env | default('stg') }}/nexus-chief/group_vars/all/gcp.yml"

    - name: Display provision info
      debug:
        msg: |
          ================================
          Provisioning NexusChiefCommander ({{ deploy_env | default('stg') }})
          ================================
          Project: {{ gcp_project_id }}
          Zone: {{ gcp_zone }}
          Instance: {{ instance_name }}
          Machine Type: {{ instance_type }}
          Disk: {{ disk_size }}GB {{ disk_type }}
          Network: {{ gcp_network }} / {{ gcp_subnet }}
          Spot: {{ provisioning_model }}
          ================================

  roles:
    - role: gcp-compute
      vars:
        gcp_instance_name: "{{ instance_name }}"
        gcp_machine_type: "{{ instance_type }}"
        gcp_machine_type_spot: "{{ instance_type }}"
        gcp_disk_size_gb: "{{ disk_size }}"
        gcp_disk_type: "{{ disk_type }}"
        gcp_spot_instance: "{{ provisioning_model == 'SPOT' }}"
        gcp_network: "{{ gcp_network }}"
        gcp_subnetwork: "{{ gcp_subnetwork | default(gcp_subnet) }}"
        gcp_instance_labels: "{{ gcp_common_labels }}"
        gcp_instance_tags: "{{ gcp_common_tags | default(instance_tags) }}"
        gcp_firewall_allow_ssh: true
        gcp_firewall_allow_http: false
        gcp_firewall_allow_https: false
        gcp_firewall_allow_gateway: true

  post_tasks:
    - name: Display provisioned instance info
      debug:
        msg: |
          ================================
          NexusChiefCommander VM Provisioned! ({{ deploy_env | default('stg') }})
          ================================
          Instance Name: {{ instance_name }}
          Project: {{ gcp_project_id }}
          Zone: {{ gcp_zone }}
          ================================
          Next steps:
          ansible-playbook playbooks/nexus-chief/deploy.yml -e "deploy_env={{ deploy_env | default('stg') }}"
          ===================================