---
# GCP Dynamic Inventory Configuration for NexusChiefCommander
# =====================================

plugin: gcp_compute
projects:
  - "{{ gcp_project_id }}"
filters: []
zones:
  - "{{ gcp_zone }}"
auth_kind: application
scopes:
  - "https://www.googleapis.com/auth/compute.readonly"

keyed_groups:
  - key: labels.environment
    prefix: env
    separator: "_"
  - key: labels.application
    prefix: app
    separator: "_"
  - key: labels.role
    prefix: role
    separator: "_"
  - key: zone
    prefix: zone
    separator: "_"

compose:
  ansible_host: networkInterfaces[0].accessConfigs[0].natIP
  internal_ip: networkInterfaces[0].networkIP
  instance_name: name
  instance_tags: tags.items