---
# NexusChiefCommander Inventory
# =====================================
# NexusChiefCommander - Infrastructure Control Plane Agent
# Hosts auto-discovered by gcp_compute.yml dynamic inventory
# This file defines groups and connection settings

all:
  vars:
    ansible_user: addheputra
    ansible_ssh_private_key_file: ~/.ssh/mastercontrol-gcp
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
    ansible_become: true
    ansible_become_method: sudo
    ansible_become_user: root
  children:
    nexus_chief:
      # Hosts populated dynamically by gcp_compute.yml
      # VMs with labels: application=nexus-chief
      hosts: {}