---
# =====================================
# NexusChiefCommander PRD - GCP Configuration
# =====================================

# GCP Project
gcp_project_id: "ai-core-system-bot-prd"
gcp_region: "asia-southeast2"
gcp_zone: "asia-southeast2-b"

# GCP Service Account (from vault)
gcp_service_account_email: "{{ vault_gcp_service_account_email }}"
gcp_service_account_key: "{{ vault_gcp_service_account_key }}"

# Network
gcp_network: "custom-vpc"
gcp_subnetwork: "custom-vpc-prod-subnet"

# Labels
gcp_common_labels:
  environment: "production"
  managed_by: "ansible"
  owner: "{{ owner }}"
  project: "{{ org_name }}"
  cost_center: "production-infrastructure"

# Tags
gcp_common_tags:
  - "production"
  - "ansible-managed"
  - "nexus-chief"