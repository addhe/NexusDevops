---
# =====================================
# NexusChiefCommander STG - OpenClaw Configuration
# =====================================

# Application
openclaw_version: "2026.5.7"
openclaw_user: "openclaw"
openclaw_group: "openclaw"
openclaw_workspace: "/home/openclaw/.openclaw/workspace"

# Service
openclaw_service_name: "openclaw"
openclaw_service_description: "NexusChiefCommander STG - Infrastructure Control Plane Agent"

# Gateway
gateway_port: 18789
gateway_bind: "lan"
gateway_mode: "local"

# Telegram (from vault)
telegram_bot_token: "{{ vault_telegram_bot_token }}"
telegram_allowed_users: "{{ vault_telegram_allowed_users }}"
telegram_group_policy: "open"
telegram_group_allow_from:
  - "*"
telegram_groups:
  "-1003992326232":
    requireMention: false
    allowFrom:
      - "*"

# Gateway Auth (from vault)
gateway_token: "{{ vault_gateway_token }}"

# =====================================
# Ollama Configuration
# =====================================
ollama_cloud_enabled: true
ollama_cloud_api_key: "{{ vault_ollama_api_key }}"
ollama_cloud_host: "https://ollama.com"
ollama_cloud_model: "glm-5"

# OpenClaw Model (staging uses glm-5, production uses glm-5.1)
openclaw_model: "ollama/{{ ollama_cloud_model }}"

# Messages
group_chat_visible_replies: "automatic"
ack_reaction_scope: "all"

# Session
session_scope: "global"

# Logging
openclaw_log_level: "debug"